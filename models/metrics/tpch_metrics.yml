version: 2

metrics:

  - name: total_revenue
    label: "Total Revenue"
    description: "Total income from all orders"
    type: simple
    type_params:
      measure:
        name: gross_item_sales_amount

  - name: total_customers
    label: "Total Customers"
    description: "Total customers with an order"
    type: simple
    type_params:
      measure:
        name: customer_key

  - name: total_expenses
    label: "Total Expenses"
    description: "Total expenses from all orders"
    type: simple
    type_params:
      measure:
        name: supplier_cost

  - name: total_profit
    label: "Total Profit"
    description: "Profit = Revenue – Expenses"
    type: derived
    type_params:
      metrics: 
        - total_revenue
        - total_expenses
      expr: total_revenue  - total_expenses 

  - name: average_revenue_per_customer
    label: "Average Revenue Per Customer"
    description: "Revenue divided by number of customers"
    type: derived
    type_params:
      metrics:
        - total_revenue
        - total_customers
      expr:  total_revenue/  total_customers 
